name: ctx-sync
description: Fail the check when AI context files are out of sync with .ai/ or expose secrets.
author: ctx-sync contributors
branding:
  icon: shield
  color: blue

inputs:
  targets:
    description: "Comma-separated assistants to check (claude, cursor, copilot, windsurf). Empty means all enabled in ctx-sync.config.json."
    required: false
    default: ""
  max-tokens:
    description: "Token budget per assistant and in total. Empty uses the default (4000); 0 disables the check."
    required: false
    default: ""
  strict:
    description: "Also fail on warnings (token budget exceeded, empty or duplicate rules)."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Build ctx-sync
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ ! -f dist/index.js ]; then
          npm ci --ignore-scripts --no-audit --no-fund --loglevel=error
          npm run build --silent
        fi

    - name: Run ctx-sync check
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INPUT_TARGETS: ${{ inputs.targets }}
        INPUT_MAX_TOKENS: ${{ inputs.max-tokens }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        set -euo pipefail

        args=( check )

        # Inputs reach the shell only through env vars, never interpolated into
        # the script, so a crafted value cannot inject commands.
        targets="${INPUT_TARGETS//[[:space:]]/}"
        if [ -n "$targets" ]; then
          args+=( --targets "$targets" )
        fi

        max_tokens="${INPUT_MAX_TOKENS//[[:space:]]/}"
        if [ -n "$max_tokens" ]; then
          if [[ ! "$max_tokens" =~ ^[0-9]+$ ]]; then
            echo "::error title=ctx-sync::Invalid max-tokens '${INPUT_MAX_TOKENS}'. Use a non-negative integer (0 disables the limit)."
            exit 2
          fi
          args+=( --max-tokens "$max_tokens" )
        fi

        strict="$(printf '%s' "${INPUT_STRICT}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
        case "$strict" in
          true) args+=( --strict ) ;;
          false|"") ;;
          *)
            echo "::error title=ctx-sync::Invalid strict value '${INPUT_STRICT}'. Use true or false."
            exit 2
            ;;
        esac

        # Exits 1 (failing the check) on out-of-sync files or exposed secrets,
        # and on warnings too when strict is true. Findings appear as
        # annotations on the pull request.
        node "$GITHUB_ACTION_PATH/dist/index.js" "${args[@]}"
