name: ctx-sync
description: Sync AI context rules, enforce token budgets, and block leaked secrets in CI.
author: ctx-sync contributors
branding:
  icon: shield
  color: blue

inputs:
  command:
    description: "Command to run: build or audit."
    required: false
    default: audit
  root:
    description: "Repository root. Defaults to the GitHub workspace."
    required: false
    default: ""
  source-dir:
    description: "Context source directory, relative to the repository root."
    required: false
    default: ".ai"
  profiles:
    description: "Comma-separated profiles to include (claude, cursor, copilot, windsurf). Empty means config/default."
    required: false
    default: ""
  fail-on:
    description: "Audit failure threshold: warning, critical, or never."
    required: false
    default: warning
  check:
    description: "For command=build: verify generated files are current instead of writing."
    required: false
    default: "true"
  annotations:
    description: "Emit GitHub Actions annotations (recommended). Set to false for plain text."
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Prepare ctx-sync
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        set -euo pipefail
        if [ ! -f dist/cli.js ]; then
          npm ci --no-audit --no-fund --loglevel=error
          npm run build --silent
        fi

    - name: Run ctx-sync
      shell: bash
      env:
        INPUT_COMMAND: ${{ inputs.command }}
        INPUT_ROOT: ${{ inputs.root }}
        INPUT_SOURCE_DIR: ${{ inputs.source-dir }}
        INPUT_PROFILES: ${{ inputs.profiles }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CHECK: ${{ inputs.check }}
        INPUT_ANNOTATIONS: ${{ inputs.annotations }}
      run: |
        set -euo pipefail

        command="${INPUT_COMMAND,,}"
        case "$command" in
          audit|build) ;;
          *)
            echo "::error title=ctx-sync::Invalid command '${INPUT_COMMAND}'. Use 'audit' or 'build'."
            exit 2
            ;;
        esac

        root="${INPUT_ROOT:-$GITHUB_WORKSPACE}"
        args=( "$command" --root "$root" )

        if [ -n "${INPUT_SOURCE_DIR}" ]; then
          args+=( --source "${INPUT_SOURCE_DIR}" )
        fi

        if [ -n "${INPUT_PROFILES}" ]; then
          IFS=',' read -ra profiles <<< "${INPUT_PROFILES}"
          for profile in "${profiles[@]}"; do
            profile="${profile//[[:space:]]/}"
            if [ -n "$profile" ]; then
              args+=( --profile "$profile" )
            fi
          done
        fi

        if [ "$command" = "build" ]; then
          check="${INPUT_CHECK,,}"
          if [ "$check" = "true" ]; then
            args+=( --check )
          elif [ "$check" != "false" ]; then
            echo "::error title=ctx-sync::Invalid check value '${INPUT_CHECK}'. Use true or false."
            exit 2
          fi
        else
          args+=( --fail-on "${INPUT_FAIL_ON,,}" )
        fi

        annotations="${INPUT_ANNOTATIONS,,}"
        if [ "$annotations" = "true" ]; then
          args+=( --github )
        elif [ "$annotations" != "false" ]; then
          echo "::error title=ctx-sync::Invalid annotations value '${INPUT_ANNOTATIONS}'. Use true or false."
          exit 2
        else
          args+=( --no-color )
        fi

        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
