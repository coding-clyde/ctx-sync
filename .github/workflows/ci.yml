name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, test and check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # Dogfooding: the repository's own AI context must be in sync with .ai/
      # and free of exposed secrets. Exits 1 otherwise (warnings too, --strict).
      - name: ctx-syncr check
        run: node dist/index.js check --strict

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ctx-syncr check
        uses: ./
        with:
          strict: "true"
