name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev tooling
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Verify native files are current
        run: node dist/cli.js build --check --no-color

      - name: Audit context
        run: node dist/cli.js audit --fail-on warning --no-color

  action:
    name: GitHub Action self-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify generated files
        uses: ./
        with:
          command: build
          check: "true"

      - name: Audit tokens and secrets
        uses: ./
        with:
          command: audit
          fail-on: warning
